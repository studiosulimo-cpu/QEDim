 if(d.ser==='IDP'){const g=(d.rcd==='B'||d.rcd==='A[EV]')?PD.IDP.evb:PD.IDP.std;return (g[d.poles]?.[d.In]||10)*r}
 return 0}
const descDev=d=>{
 if(famOf(d)==='MDC')return`Magnetotermico differenziale ${d.ser} ${d.poles} ${d.curve}${d.In} tipo ${d.rcd} ${d.idn} mA`;

 if(d.ser==='IDP')return`Differenziale puro IDP ${d.poles} ${d.In} A tipo ${d.rcd} ${d.idn} mA`;return d.code};

// Selezione protezione di linea
function pickProt(q){
 // q: {Ib,fasi,rcd,idn,curve,T,Icc,minIn,maxIn,gen}
 const P1=q.fasi==3?['4P']:['1P+N','2P'], PR=q.fasi==3?'4P':'2P', V=q.fasi==3?400:230;
 const okIn=(fam,In)=>In>=(q.minIn||0)&&(!q.maxIn||In<=q.maxIn)&&inEff(fam,In,q.T)>=q.Ib;
 const sols=[];
 const mdcT={A:['A'],'A[IR]':['A[IR]'],'A[S]':['A[S]'],F:['F']}[q.rcd]||[];
 const noRcd=q.rcd==='none';
 if(!noRcd)for(const ser of['MDC 60','MDC 100'])for(const po of P1){
  const c=DEV.filter(d=>d.ser===ser&&d.poles===po&&d.curve===q.curve&&mdcT.includes(d.rcd)&&d.idn===q.idn).sort((a,b)=>a.In-b.In).find(d=>okIn('MDC',d.In));
  if(c){sols.push({kind:'MDC',items:[c],prot:c,In:c.In,mods:c.mods});break}}
 const mts=[];
 for(const ser of['MT 60','MT 100']){
  const po=q.fasi==3?['4P']:(q.curve==='C'?['1P+N','2P']:['2P']);
  for(const p of po){const c=DEV.filter(d=>d.ser===ser&&d.poles===p&&d.curve===q.curve).sort((a,b)=>a.In-b.In).find(d=>okIn('MT',d.In));if(c){mts.push(c);break}}}
 for(const mt of mts){
  if(noRcd){sols.push({kind:'MT',items:[mt],prot:mt,In:mt.In,mods:mt.mods});continue}
  if(['A','A[S]','A[IR]'].includes(q.rcd)){const bd=DEV.filter(d=>d.ser==='BD'&&d.poles===PR&&d.rcd===q.rcd&&d.idn===q.idn&&d.In>=mt.In).sort((a,b)=>a.In-b.In)[0];
   if(bd)sols.push({kind:'MT+BD',items:[mt,bd],prot:mt,In:mt.In,mods:mt.mods+bd.mods,bdRole:mt.In})}
  const idp=DEV.filter(d=>d.ser==='IDP'&&d.poles===PR&&d.rcd===q.rcd&&d.idn===q.idn&&d.In>=mt.In&&inEff('IDP',d.In,q.T)>=q.Ib).sort((a,b)=>a.In-b.In)[0];
  if(idp)sols.push({kind:'MT+IDP',items:[mt,idp],prot:mt,In:mt.In,mods:mt.mods+idp.mods})}
 if(!sols.length)return null;
 sols.forEach(s=>{const r=icnOf(s.prot);s.icn=r.icn;s.icu=r.icu;s.icOk=r.icn>=q.Icc/1000;
  const b=BU[s.prot.ser]?.[V]?.[buKey(q.gen)];s.bu=(!s.icOk&&b&&b>=q.Icc/1000)?b:null});
 const order=['MT','MDC','MT+BD','MT+IDP'];
 const feas=x=>x.icOk||x.bu?0:1;
 sols.sort((a,b)=>feas(a)-feas(b)||order.indexOf(a.kind)-order.indexOf(b.kind)||(a.icOk?0:1)-(b.icOk?0:1)||a.icn-b.icn);
 return sols[0];
}

 <tr><td>Soglia SPI 11,08 kW; Icc F-N 6 kA in trifase</td><td>CEI 0-21 / ipotesi</td><td>Probabile / ipotesi</td></tr></table></div>
 <div class="card"><h2>Declassamento in temperatura (A)</h2>${Object.entries(DER).map(([k,t])=>`<h3>${k}</h3><div class="tw"><table><tr><th>In</th>${t.T.map(x=>`<th class="n">${x} °C</th>`).join('')}</tr>${Object.entries(t.v).map(([i,v])=>`<tr><td>${i}</td>${row(v)}</tr>`).join('')}</table></div>`).join('')}</div>
 <div class="card"><h2>I²t (A²s) a 1 / 3 / 4,5 / 6 / 10 kA</h2>${Object.entries(I2T).map(([k,c])=>`<h3>${k}${c.env?' (inviluppo)':''} — fino a ${f(c.xmax/1000,1)} kA</h3><div class="tw"><table><tr><th>In</th>${I2T_PTS.map(x=>`<th class="n">${x/1000} kA</th>`).join('')}</tr>${Object.entries(c.t).sort((a,b)=>a[0]-b[0]).map(([i,v])=>`<tr><td>${i}</td>${row(v.map(x=>x?f(x,0):'—'))}</tr>`).join('')}</table></div>`).join('')}</div>
 <div class="card"><h2>Centralini</h2><table><tr><th>Serie</th><th>Moduli</th><th>Codici (fumè / cieca)</th><th class="n">Potenza dissipabile (W)</th></tr>${Object.values(ENC).map(E=>E.t.map(e=>`<tr><td>${E.nome}</td><td>${e.mod}</td><td>${e.c.fume} / ${e.c.cieca}${e.ver?' — da confermare':''}</td><td class="n">${e.p}</td></tr>`).join('')).join('')}</table></div>`;}

/* ===================== BINDING ===================== */
let lastR=null;
function recalc(){try{lastR=calc();renderRis(lastR);renderQuadro(lastR)}catch(e){console.error(e);$('#t-ris').innerHTML=`<div class="card"><div class="msg er">Errore di calcolo: ${esc(e.message)}</div></div>`}saveLS()}
document.addEventListener('change',e=>{const k=e.target.dataset?.k;if(!k)return;
 let v=e.target.value;if(e.target.dataset.t==='n'){v=parseFloat(String(v).replace(',','.'));if(!isFinite(v))return}
 setP(k,v);
 if(/^circ\.\d+\.tipo$/.test(k)){const c=getP(k.replace('.tipo',''));c.cos=TIPI[v].cos;renderCirc()}
 if(k==='forn.fasi'){S.forn.icc=v==3?10:6;renderForn();renderQd();renderCirc();renderPV()}
 else if(/^quadri\.\d+\.(nome|parent|fasi)$/.test(k)){renderQd();renderCirc();renderPV()}
 else if(/^(circ|inv)\.\d+\.(fasi|q)$/.test(k)){renderCirc();renderPV()}
 if(k==='forn.genDiff')renderForn();
 if(/^inv\.\d+\.nome$/.test(k))renderPV();
 recalc()});
document.addEventListener('input',e=>{if(e.target.tagName==='INPUT'&&e.target.dataset?.t==='n'){clearTimeout(window._t);window._t=setTimeout(()=>e.target.dispatchEvent(new Event('change',{bubbles:true})),500)}});
function renderAll(){renderNav();renderForn();renderQd();renderCirc();renderPV();renderDB();recalc();showTab(curTab)}
renderAll();
</script>
</body>
